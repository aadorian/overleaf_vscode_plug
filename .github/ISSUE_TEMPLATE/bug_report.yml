name: Bug report
description: Report a problem with the extension
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to file a bug report!
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a project ...
        2. Run command ...
        3. See error ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: vscode
    attributes:
      label: VS Code version
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
    validations:
      required: true
  - type: input
    id: latex
    attributes:
      label: LaTeX distribution (e.g. TeX Live 2024, MiKTeX)
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Output from the "LaTeX Overleaf" output channel.
      render: shell
